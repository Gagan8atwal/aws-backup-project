name: ALOS SmolVLM artifact diagnostic

on:
  push:
    branches: [main]

permissions: {}

jobs:
  artifact-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify exact governed model downloads
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/alos-smolvlm-artifact-diag"
          mkdir -p "$ROOT"
          MODEL_REV=72e986006ef53e37cdd3f6d4241c90b0f01df376
          MODEL_FILE=SmolVLM-500M-Instruct-Q8_0.gguf
          MODEL_SHA_EXPECTED=9d4612de6a42214499e301494a3ecc2be0abdd9de44e663bda63f1152fad1bf4
          MODEL_BYTES_EXPECTED=436806912
          MMPROJ_FILE=mmproj-SmolVLM-500M-Instruct-Q8_0.gguf
          MMPROJ_SHA_EXPECTED=d1eb8b6b23979205fdf63703ed10f788131a3f812c7b1f72e0119d5d81295150
          MMPROJ_BYTES_EXPECTED=108783360
          for FILE in "$MODEL_FILE" "$MMPROJ_FILE"; do
            URL="https://huggingface.co/ggml-org/SmolVLM-500M-Instruct-GGUF/resolve/$MODEL_REV/$FILE?download=true"
            echo "FETCH_START file=$FILE"
            curl -fL --retry 2 --connect-timeout 20 --max-time 300 -w 'HTTP_FINAL=%{http_code} SIZE_DOWNLOAD=%{size_download} URL_EFFECTIVE=%{url_effective}\n' "$URL" -o "$ROOT/$FILE"
            SHA=$(sha256sum "$ROOT/$FILE" | awk '{print $1}')
            BYTES=$(wc -c < "$ROOT/$FILE" | tr -d ' ')
            echo "FETCH_RESULT file=$FILE sha256=$SHA bytes=$BYTES"
          done
          MODEL_SHA=$(sha256sum "$ROOT/$MODEL_FILE" | awk '{print $1}')
          MODEL_BYTES=$(wc -c < "$ROOT/$MODEL_FILE" | tr -d ' ')
          MMPROJ_SHA=$(sha256sum "$ROOT/$MMPROJ_FILE" | awk '{print $1}')
          MMPROJ_BYTES=$(wc -c < "$ROOT/$MMPROJ_FILE" | tr -d ' ')
          test "$MODEL_SHA" = "$MODEL_SHA_EXPECTED"
          test "$MODEL_BYTES" = "$MODEL_BYTES_EXPECTED"
          test "$MMPROJ_SHA" = "$MMPROJ_SHA_EXPECTED"
          test "$MMPROJ_BYTES" = "$MMPROJ_BYTES_EXPECTED"
          echo ALOS_SMOLVLM_ARTIFACT_DOWNLOAD=PASS
          rm -rf "$ROOT"
